# Docker Compose — ローカル開発 & セルフホスティング用
# 起動: docker compose -f inquiry_bot/docker-compose.yaml up -d

services:
  inquiry-bot:
    build:
      context: ..
      dockerfile: inquiry_bot/Dockerfile
    container_name: rockedge-inquiry-bot
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - ../.env
    volumes:
      # FAQ/物件データの変更をリアルタイム反映
      - ../inquiry_bot/faq_data.yaml:/app/inquiry_bot/faq_data.yaml:ro
      - ../inquiry_bot/properties.yaml:/app/inquiry_bot/properties.yaml:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8080/api/health', timeout=3).raise_for_status()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
