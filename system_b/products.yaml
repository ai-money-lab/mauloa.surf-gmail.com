  # ═══ Tier 1: 高単価（30-50万円） ═══
  - id: "tier1_area_analysis"
    name: "不動産投資エリア分析レポート"
    price_range: [300000, 500000]
    description: "指定エリアの投資判断材料を完全網羅したプロフェッショナルレポート"
    deliverables:
      - 人口動態分析（過去10年+将来予測）
      - 地価推移と予測（公示地価・路線価・実勢価格）
      - 賃料相場と空室率
      - 競合物件の供給状況
      - 再開発・インフラ計画の影響分析
      - 収益シミュレーション（3パターン）
      - HIROKI所見（プロの経験に基づく定性判断）
    crew_tasks: ["area_analysis"]
    auto_rate: 80
    quality_profile: "report"
    template: "area_analysis_report.md"
    output_format: "pdf"

  - id: "tier1_dx_consulting"
