# GitHub Actions — System A: X 自動投稿
# 毎日 18:30 JST に生成 → LINE承認待ち → 承認後に19:00投稿（1日1回）
# 手動実行も可能（workflow_dispatch）

name: X Auto Post

on:
  schedule:
    # cron は UTC で指定（JST = UTC+9）
    - cron: '30 9 * * *'   # 18:30 JST（生成＋承認依頼）
  workflow_dispatch:
    inputs:
      mode:
        description: 'Mode: generate (生成+承認待ち) or approve (承認して投稿)'
        required: true
        type: choice
        options:
          - 'generate'
          - 'approve'
        default: 'generate'
      pillar:
        description: 'Target pillar (1-5, empty=auto) — generate mode only'
        required: false
        type: choice
        options:
          - ''
          - '1'
          - '2'
          - '3'
          - '4'
          - '5'
      dry_run:
        description: 'Dry run (no posting) — generate mode only'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install anthropic requests requests-oauthlib python-dotenv \
                    pyyaml gspread google-auth beautifulsoup4 lxml pandas

      - name: Generate or Approve
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET_KEY: ${{ secrets.X_API_SECRET_KEY }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TWITTERAPI_IO_KEY: ${{ secrets.TWITTERAPI_IO_KEY }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
        run: |
          MODE="${{ inputs.mode }}"
          # Scheduled runs always generate (never auto-post)
          if [ -z "$MODE" ]; then
            MODE="generate"
          fi

          if [ "$MODE" = "approve" ]; then
            PYTHONPATH=. python -m system_a.generate_and_post --approve
          else
            ARGS=""
            if [ "${{ inputs.dry_run }}" = "true" ]; then
              ARGS="$ARGS --dry-run"
            fi
            if [ -n "${{ inputs.pillar }}" ]; then
              ARGS="$ARGS --pillar ${{ inputs.pillar }}"
            fi
            PYTHONPATH=. python -m system_a.generate_and_post $ARGS
          fi

      - name: Commit data updates
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f data/
          git diff --cached --quiet || git commit -m "auto: X post data update $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push
