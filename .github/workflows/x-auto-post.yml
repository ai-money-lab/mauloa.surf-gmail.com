# GitHub Actions — System A: X 自動投稿
# HIROKIMIYAO戦略: 週8本（曜日別スケジュール）
# 手動実行も可能（workflow_dispatch）

name: X Auto Post

on:
  schedule:
    # cron は UTC で指定（JST = UTC+9）
    - cron: '30 22 * * 0'  # 月 07:30 JST — プロの裏話（柱1）
    - cron: '0 3 * * 2'    # 火 12:00 JST — 相談事例（柱3）
    - cron: '30 22 * * 2'  # 水 07:30 JST — プロの裏話（柱1）
    - cron: '0 11 * * 4'   # 木 20:00 JST — ビフォーアフター（柱2）
    - cron: '30 22 * * 4'  # 金 07:30 JST — プロの裏話/時事ネタ（柱1/5）
    - cron: '0 1 * * 6'    # 土 10:00 JST — 日常・人柄（柱4）
    - cron: '0 11 * * 0'   # 日 20:00 JST — 相談事例/Q&A（柱3）
  workflow_dispatch:
    inputs:
      pillar:
        description: 'Target pillar (1-5, empty=auto)'
        required: false
        type: choice
        options:
          - ''
          - '1'
          - '2'
          - '3'
          - '4'
          - '5'
      dry_run:
        description: 'Dry run (no posting)'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install anthropic requests requests-oauthlib python-dotenv \
                    pyyaml gspread google-auth beautifulsoup4 lxml pandas

      - name: Generate and Post
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET_KEY: ${{ secrets.X_API_SECRET_KEY }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TWITTERAPI_IO_KEY: ${{ secrets.TWITTERAPI_IO_KEY }}
        run: |
          ARGS=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          if [ -n "${{ inputs.pillar }}" ]; then
            ARGS="$ARGS --pillar ${{ inputs.pillar }}"
          fi
          PYTHONPATH=. python -m system_a.generate_and_post $ARGS

      - name: Commit data updates
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f data/
          git diff --cached --quiet || git commit -m "auto: X post data update $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push
