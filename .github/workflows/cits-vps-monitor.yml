# GitHub Actions -- CITS VPS Silence Monitor
# 取引時間中 (09:00-15:30 JST) に10分毎に実行。
# vps_agent/watchdog が30分以上無応答 → 即メールアラート。
#
# 必須Secret: GMAIL_APP_PASSWORD (GitHub Settings > Secrets > Actions)
#   値: VPS .env の GMAIL_APP_PASSWORD と同じ値

name: CITS VPS Silence Monitor

on:
  schedule:
    # 10分毎 09:00-15:50 JST = 00:00-06:50 UTC Mon-Fri
    - cron: '*/10 0-6 * * 1-5'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-vps:
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/continue-kabusute-DmFKB

      - name: Check VPS heartbeat and send alert if silent
        env:
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: |
          python3 - <<'PYEOF'
          import json, sys, os, smtplib
          from pathlib import Path
          from datetime import datetime, timezone, timedelta
          from email.mime.text import MIMEText

          JST = timezone(timedelta(hours=9))
          now = datetime.now(JST)
          now_str = now.strftime("%Y-%m-%d %H:%M:%S JST")

          # 週末はスキップ
          if now.weekday() >= 5:
              print(f"Weekend ({now_str}) — skip")
              sys.exit(0)

          # 取引時間外はスキップ (09:00-15:30 JST)
          market_open  = now.replace(hour=9,  minute=0,  second=0, microsecond=0)
          market_close = now.replace(hour=15, minute=30, second=0, microsecond=0)
          if not (market_open <= now <= market_close):
              print(f"Outside market hours ({now.strftime('%H:%M JST')}) — skip")
              sys.exit(0)

          print(f"Market hours check: {now_str}")

          # VPS応答ファイルを確認
          ALERT_THRESHOLD_MIN = 30  # 30分以上無応答でアラート
          checks = [
              ("vps_agent",  Path("cits/data/vps_status.json")),
              ("watchdog",   Path("cits/data/watchdog_status.json")),
          ]

          alerts = []
          status_lines = []

          for name, path in checks:
              if not path.exists():
                  alerts.append(f"{name}: ファイル不存在 (一度も応答なし)")
                  status_lines.append(f"  {name}: FILE NOT FOUND")
                  continue
              try:
                  data = json.loads(path.read_text(encoding="utf-8"))
                  ts_str = data.get("timestamp", "")
                  if not ts_str:
                      alerts.append(f"{name}: タイムスタンプなし")
                      continue
                  ts = datetime.fromisoformat(ts_str.replace("Z", "+00:00"))
                  if ts.tzinfo is None:
                      ts = ts.replace(tzinfo=JST)
                  age_min = (now - ts).total_seconds() / 60
                  age_str = f"{age_min:.0f}分前"
                  status_lines.append(
                      f"  {name}: 最終応答 {ts.strftime('%H:%M JST')} ({age_str})"
                  )
                  print(f"{name}: age={age_min:.0f}min ts={ts.strftime('%H:%M JST')}")
                  if age_min > ALERT_THRESHOLD_MIN:
                      alerts.append(
                          f"{name}: {age_min:.0f}分間無応答"
                          f" (最終: {ts.strftime('%Y-%m-%d %H:%M JST')})"
                      )
              except Exception as exc:
                  alerts.append(f"{name}: 読み取りエラー {exc}")

          if not alerts:
              print("VPS heartbeat: OK — all systems responding")
              sys.exit(0)

          # ━━━━━━ アラート送信 ━━━━━━
          print(f"ALERT CONDITION: {alerts}")

          body_lines = [
              "=" * 60,
              "CITS VPS 無応答アラート",
              "=" * 60,
              f"発生時刻: {now_str}",
              f"市場状態: 取引時間中 ({now.strftime('%H:%M JST')})",
              "",
              "【問題】",
          ]
          for a in alerts:
              body_lines.append(f"  ❌ {a}")
          body_lines += [
              "",
              "【現在のVPS状態】",
          ]
          body_lines += status_lines
          body_lines += [
              "",
              "【即時対応手順】",
              "  1. VPS (203.183.9.252) にRDP接続",
              "     ユーザー: Administrator",
              "  2. コマンドプロンプトで確認:",
              "     > tasklist | findstr python",
              "     > git --version",
              "     > netstat -an | findstr 18080",
              "  3. vps_agentが死んでいる場合:",
              "     > cd C:\\cits\\repo",
              "     > C:\\cits\\venv\\Scripts\\pythonw.exe -m cits.scripts.vps_agent",
              "  4. git.exeが壊れている場合:",
              "     > winget install Git.Git --silent",
              "  5. 未決済ポジションがある場合:",
              "     kabuStationで手動決済すること",
              "",
              "このメールはCITS VPS Monitorが自動送信しました。",
          ]
          body = "\n".join(body_lines)

          gmail_pw = os.environ.get("GMAIL_APP_PASSWORD", "")
          if not gmail_pw:
              print("GMAIL_APP_PASSWORD not set — cannot send email alert")
              print("Set it in: GitHub Settings > Secrets > Actions > GMAIL_APP_PASSWORD")
              sys.exit(0)

          msg = MIMEText(body, "plain", "utf-8")
          msg["Subject"] = (
              f"[CITS緊急アラート] VPS無応答 {now.strftime('%H:%M')}JST"
              f" — {len(alerts)}件の問題"
          )
          msg["From"] = "mauloa.surf@gmail.com"
          msg["To"]   = "mauloa.surf@gmail.com"

          try:
              with smtplib.SMTP_SSL("smtp.gmail.com", 465) as smtp:
                  smtp.login("mauloa.surf@gmail.com", gmail_pw)
                  smtp.send_message(msg)
              print(f"Alert email sent: {msg['Subject']}")
          except Exception as exc:
              print(f"Email send failed: {exc}")
          PYEOF
