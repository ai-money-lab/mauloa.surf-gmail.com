name: CITS Daily Scan

# Full CIS + Kei-kun scan on all TSE tickers.
# Runs twice daily at actionable times. Output: cits/data/scan_results.json
# For real-time market gate status, see cits-market-monitor.yml

on:
  schedule:
    - cron: '30 0 * * 1-5'   # 09:30 JST (morning open)
    - cron: '50 5 * * 1-5'   # 14:50 JST (pre-close)
  workflow_dispatch:
    inputs:
      etf_only:
        description: 'ETF-only scan (fast)'
        required: false
        default: 'false'
        type: boolean

concurrency:
  group: cits-daily-scan
  cancel-in-progress: false   # don't cancel a running full scan

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/continue-kabusute-DmFKB
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          pip install --quiet \
            "yfinance>=0.2.50" pandas numpy openpyxl xlrd requests \
            python-dotenv pyyaml ta

      - name: Run scan
        env:
          PYTHONPATH: ${{ github.workspace }}
          TZ: Asia/Tokyo
        run: |
          if [ "${{ github.event.inputs.etf_only }}" = "true" ]; then
            python -m cits.scripts.run_scan_gha --etf-only
          else
            python -m cits.scripts.run_scan_gha
          fi

      - name: Commit results
        run: |
          git config user.name  "CITS GitHub Actions"
          git config user.email "actions@github.com"
          git pull --rebase origin claude/continue-kabusute-DmFKB
          git add -f cits/data/scan_results.json
          git diff --cached --quiet && echo "No changes" || \
            git commit -m "scan: $(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M JST')"
          git push origin claude/continue-kabusute-DmFKB
