name: CITS Daily Scan

# Runs independently of VPS — always produces scan_results.json
# 09:30 JST  = 00:30 UTC  morning open scan
# 14:50 JST  = 05:50 UTC  afternoon pre-close scan (main)
# Manual dispatch for ad-hoc analysis

on:
  schedule:
    - cron: '30 0 * * 1-5'   # 09:30 JST (morning)
    - cron: '50 5 * * 1-5'   # 14:50 JST (afternoon)
  workflow_dispatch:
    inputs:
      etf_only:
        description: 'ETF-only scan (fast, ~30s)'
        required: false
        default: 'false'
        type: boolean

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: claude/continue-kabusute-DmFKB
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          pip install --quiet \
            yfinance>=0.2.50 \
            pandas>=2.0 \
            numpy>=1.26 \
            openpyxl \
            xlrd \
            requests \
            python-dotenv \
            pyyaml

      - name: Run scan
        env:
          PYTHONPATH: ${{ github.workspace }}
          TZ: Asia/Tokyo
        run: |
          if [ "${{ github.event.inputs.etf_only }}" = "true" ]; then
            python -m cits.scripts.run_scan_gha --etf-only
          else
            python -m cits.scripts.run_scan_gha
          fi

      - name: Commit scan results
        run: |
          git config user.name  "CITS GitHub Actions"
          git config user.email "actions@github.com"
          git add -f cits/data/scan_results.json
          git diff --cached --quiet && echo "No changes" || \
            git commit -m "scan: $(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M JST')"
          git push origin claude/continue-kabusute-DmFKB
