# テスト投稿用ワークフロー（手動トリガー専用）
# 使い方: GitHub Actions → Test Post → Run workflow
name: Test Post

on:
  workflow_dispatch:

jobs:
  test-post:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests requests-oauthlib

      - name: Post test tweet
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET_KEY: ${{ secrets.X_API_SECRET_KEY }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
        run: |
          python -c "
          import os
          from requests_oauthlib import OAuth1
          import requests

          auth = OAuth1(
              os.environ['X_API_KEY'],
              os.environ['X_API_SECRET_KEY'],
              os.environ['X_ACCESS_TOKEN'],
              os.environ['X_ACCESS_TOKEN_SECRET'],
          )
          resp = requests.post(
              'https://api.x.com/2/tweets',
              json={'text': 'テスト投稿です。自動投稿システムの動作確認中。（手動で削除します）'},
              auth=auth,
              timeout=15,
          )
          print(f'Status: {resp.status_code}')
          print(f'Response: {resp.text}')
          resp.raise_for_status()
          "
