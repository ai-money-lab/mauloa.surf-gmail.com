# GitHub Actions — System E: メタ知性エンジン
#
# スケジュール:
#   - 毎日 23:00 JST: 日次診断 + 戦略進化
#   - 毎週日曜 22:00 JST: フルサイクル（診断→議論→進化→レポート）
#
# 手動実行も可能（workflow_dispatch）

name: System E Meta-Intelligence

on:
  schedule:
    - cron: '0 14 * * *'    # 23:00 JST (UTC 14:00)
    - cron: '0 13 * * 0'    # 22:00 JST Sunday (UTC 13:00)
  workflow_dispatch:
    inputs:
      mode:
        description: '実行モード'
        required: true
        type: choice
        options:
          - 'diagnose'
          - 'evolve'
          - 'debate'
          - 'optimize'
          - 'full-cycle'
      topic:
        description: '議論トピック（debateモード用）'
        required: false
        type: string
        default: ''

permissions:
  contents: write

jobs:
  meta:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install anthropic requests python-dotenv pyyaml

      - name: Determine mode
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "mode=${{ inputs.mode }}" >> $GITHUB_OUTPUT
          elif [ "$(date -u +%u)" = "0" ]; then
            echo "mode=full-cycle" >> $GITHUB_OUTPUT
          else
            echo "mode=diagnose" >> $GITHUB_OUTPUT
          fi

      - name: Run System E
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          MODE="${{ steps.mode.outputs.mode }}"
          TOPIC="${{ inputs.topic }}"
          echo "Running System E: $MODE"

          ARGS="--mode $MODE"
          if [ -n "$TOPIC" ]; then
            ARGS="$ARGS --topic \"$TOPIC\""
          fi

          PYTHONPATH=. python -m system_e.orchestrator $ARGS

          # 日次: diagnose 後に evolve も実行
          if [ "$MODE" = "diagnose" ]; then
            echo "Following up with evolution..."
            PYTHONPATH=. python -m system_e.orchestrator --mode evolve
          fi

      - name: Commit results
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f system_e/data/
          git diff --cached --quiet || git commit -m "auto: System E ${{ steps.mode.outputs.mode }} $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push
