# GitHub Actions — System C: 情報収集パイプライン
#
# スケジュール:
#   - 毎日 07:30 JST: 日次マーケット＆規制ウォッチ
#   - 毎週月曜 08:00 JST: 週次テックトレンドレポート
#
# 手動実行も可能（workflow_dispatch）

name: System C Data Collection

on:
  schedule:
    - cron: '30 22 * * *'   # 07:30 JST (UTC 22:30)
    - cron: '0 23 * * 0'    # 08:00 JST Monday (UTC 23:00 Sunday)
  workflow_dispatch:
    inputs:
      task:
        description: '実行タスク'
        required: true
        type: choice
        options:
          - 'daily_watch'
          - 'weekly_tech'
      dry_run:
        description: 'ドライラン'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install anthropic requests python-dotenv pyyaml \
                    beautifulsoup4 lxml pandas gspread google-auth

      - name: Determine task
        id: task
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "task=${{ inputs.task }}" >> $GITHUB_OUTPUT
          elif [ "$(date -u +%u)" = "0" ]; then
            echo "task=weekly_tech" >> $GITHUB_OUTPUT
          else
            echo "task=daily_watch" >> $GITHUB_OUTPUT
          fi

      - name: Run System C
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          echo "Running System C: ${{ steps.task.outputs.task }}"
          PYTHONPATH=. python system_c/scheduler.py --task ${{ steps.task.outputs.task }}

      - name: Commit data updates
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f data/system_c/
          git diff --cached --quiet || git commit -m "auto: System C ${{ steps.task.outputs.task }} $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push
