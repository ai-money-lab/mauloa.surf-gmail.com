# GitHub Actions — System E: Riena AI Character Pipeline
# コンテンツ生成（毎日21:00 JST）+ 投稿（毎日07/12/19/23時JST）
# 手動実行も可能（workflow_dispatch）

name: System E Pipeline

on:
  schedule:
    # Content generation: 21:00 JST (12:00 UTC) — generate tomorrow's content + images
    - cron: '0 12 * * *'
    # Posting windows: 07:00/12:00/19:00/23:00 JST = 22:00/03:00/10:00/14:00 UTC
    - cron: '0 22 * * *'   # 07:00 JST
    - cron: '0 3 * * *'    # 12:00 JST
    - cron: '0 10 * * *'   # 19:00 JST
    - cron: '0 14 * * *'   # 23:00 JST
    # Engagement: every 2 hours (collect metrics + reply to mentions)
    - cron: '30 */2 * * *'
    # Weekly planning: Monday 08:00 JST (23:00 UTC Sun)
    - cron: '0 23 * * 0'
    # Weekly report: Monday 09:00 JST (00:00 UTC Mon)
    - cron: '0 0 * * 1'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Pipeline mode'
        required: true
        type: choice
        options:
          - 'full'
          - 'generate'
          - 'post'
          - 'engage'
          - 'optimize'
          - 'collect'
          - 'weekly'
          - 'dashboard'
          - 'plan'
          - 'recycle'
          - 'brand'
        default: 'post'
      dry_run:
        description: 'Dry run (no posting/generation)'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install anthropic requests requests-oauthlib python-dotenv \
                    pyyaml gspread google-auth beautifulsoup4 lxml pandas

      - name: Determine pipeline mode
        id: mode
        run: |
          # Manual dispatch uses the selected mode
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "mode=${{ inputs.mode }}" >> $GITHUB_OUTPUT
            exit 0
          fi
          # Scheduled: determine mode from UTC hour + minute
          HOUR=$(date -u +%H)
          MIN=$(date -u +%M)
          DAY=$(date -u +%u)  # 1=Monday, 7=Sunday
          if [ "$HOUR" = "23" ] && [ "$MIN" = "00" ] && [ "$DAY" = "7" ]; then
            echo "mode=plan" >> $GITHUB_OUTPUT  # Sunday 23:00 UTC = Mon 08:00 JST = weekly planning
          elif [ "$HOUR" = "00" ] && [ "$MIN" = "00" ] && [ "$DAY" = "1" ]; then
            echo "mode=weekly" >> $GITHUB_OUTPUT  # Monday 09:00 JST = weekly report
          elif [ "$HOUR" = "12" ] && [ "$MIN" = "00" ]; then
            echo "mode=full" >> $GITHUB_OUTPUT  # 21:00 JST = generation time
          elif [ "$MIN" = "30" ]; then
            echo "mode=engage" >> $GITHUB_OUTPUT  # :30 = engagement window
          else
            echo "mode=post" >> $GITHUB_OUTPUT  # posting windows
          fi

      - name: Run System E Pipeline
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET_KEY: ${{ secrets.X_API_SECRET_KEY }}
          X_ACCESS_TOKEN: ${{ secrets.SYSTEM_E_X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.SYSTEM_E_X_ACCESS_TOKEN_SECRET }}
          X_BEARER_TOKEN: ${{ secrets.SYSTEM_E_X_BEARER_TOKEN }}
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
          RUNPOD_POD_ID: ${{ secrets.RUNPOD_POD_ID }}
          RUNPOD_ENDPOINT_ID: ${{ secrets.RUNPOD_ENDPOINT_ID }}
          FAL_API_KEY: ${{ secrets.FAL_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
        run: |
          MODE="${{ steps.mode.outputs.mode }}"
          ARGS="--mode $MODE"
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            echo "[DRY RUN] Would run: python system_e/daily_pipeline.py $ARGS"
            PYTHONPATH=. python -c "
          from system_e.daily_pipeline import SystemEPipeline
          p = SystemEPipeline()
          print('SystemEPipeline initialized OK')
          print(f'Image provider: {p.image_pipeline.provider}')
          print(f'Image enabled: {p.image_pipeline.enabled}')
          "
            exit 0
          fi
          PYTHONPATH=. python system_e/daily_pipeline.py $ARGS

      - name: Run engagement collection & replies
        if: steps.mode.outputs.mode == 'engage'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SYSTEM_E_X_API_KEY: ${{ secrets.SYSTEM_E_X_API_KEY }}
          SYSTEM_E_X_API_SECRET_KEY: ${{ secrets.SYSTEM_E_X_API_SECRET_KEY }}
          SYSTEM_E_X_ACCESS_TOKEN: ${{ secrets.SYSTEM_E_X_ACCESS_TOKEN }}
          SYSTEM_E_X_ACCESS_TOKEN_SECRET: ${{ secrets.SYSTEM_E_X_ACCESS_TOKEN_SECRET }}
          SYSTEM_E_X_BEARER_TOKEN: ${{ secrets.SYSTEM_E_X_BEARER_TOKEN }}
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            echo "[DRY RUN] Would run: python system_e/daily_pipeline.py --mode engage"
            PYTHONPATH=. python -c "
          from system_e.engagement_collector import EngagementCollector
          from system_e.mention_responder import MentionResponder
          print('EngagementCollector initialized OK')
          print('MentionResponder initialized OK')
          "
            exit 0
          fi
          PYTHONPATH=. python system_e/daily_pipeline.py --mode engage --no-lock

      - name: Commit data updates
        if: success() && inputs.dry_run != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f data/system_e/
          git diff --cached --quiet || git commit -m "auto: System E pipeline data update $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push
