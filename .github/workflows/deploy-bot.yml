# GitHub Actions — 問い合わせBot 自動テスト & デプロイ
# mainブランチへのpushで自動発火

name: Bot CI/CD

on:
  push:
    branches: [main]
    paths:
      - 'inquiry_bot/**'
      - 'core/**'
      - 'prompts/inquiry_bot_system.txt'
      - 'requirements.txt'
  pull_request:
    branches: [main]
    paths:
      - 'inquiry_bot/**'
      - 'core/**'

permissions:
  contents: read

concurrency:
  group: bot-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        # No ANTHROPIC_API_KEY here on purpose: every test mocks the SDK
        # (tests/conftest.py injects a dummy key), so handing a live secret
        # to the test step only widens the exposure surface.
        run: PYTHONPATH=. pytest tests/ -v --tb=short

      - name: Lint check
        run: |
          pip install 'ruff>=0.14,<1'
          ruff check . --select E,W,F --ignore E501

  deploy-render:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Render
        # Render Deploy Hook URL: Settings > Deploy Hook から取得して
        # GitHub Secrets に RENDER_DEPLOY_HOOK_URL として登録。
        # 未登録のときは空URLでcurlが失敗してジョブが落ちるだけなので、
        # 「未設定」であることを明示して飛ばす。
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          set -euo pipefail
          if [ -z "${RENDER_DEPLOY_HOOK_URL:-}" ]; then
            echo "::warning::RENDER_DEPLOY_HOOK_URL is not set — skipping deploy."
            echo "RENDER_DEPLOY_HOOK_URL 未設定のためデプロイをスキップしました。" \
              >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          curl -X POST "$RENDER_DEPLOY_HOOK_URL" \
            -H "Content-Type: application/json" \
            -d '{}' \
            --fail --silent --show-error

      - name: Notify deployment
        if: success()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ -z "${SLACK_WEBHOOK_URL:-}" ]; then
            echo "SLACK_WEBHOOK_URL is not set — skipping notification."
            exit 0
          fi
          curl -X POST "$SLACK_WEBHOOK_URL" \
            -H 'Content-Type: application/json' \
            -d "{\"text\":\"✅ 問い合わせBot デプロイ完了 (commit: ${COMMIT_SHA})\"}"
        continue-on-error: true

  # FAQ/物件データの構文検証。
  # 以前は contains(github.event.head_commit.modified, 'faq_data.yaml') で
  # 絞っていたが、modified の要素は 'inquiry_bot/faq_data.yaml' という
  # フルパスなので完全一致せず、このジョブは一度も実行されていなかった。
  # 検証は数秒で終わるので、トリガーされた変更すべてで走らせる。
  validate-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Validate YAML files
        run: |
          pip install 'pyyaml>=6.0,<7'
          python - <<'PY'
          import sys
          import yaml

          files = ["inquiry_bot/faq_data.yaml", "inquiry_bot/properties.yaml"]
          failed = []
          for path in files:
              try:
                  with open(path, encoding="utf-8") as fh:
                      data = yaml.safe_load(fh)
                  print(f"OK   {path}: valid ({len(str(data))} chars)")
              except Exception as exc:
                  print(f"FAIL {path}: {exc}")
                  failed.append(path)
          if failed:
              sys.exit(1)
          PY
