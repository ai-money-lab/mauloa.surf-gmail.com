# GitHub Actions — System E: AI自動コード生成サイクル
#
# AIが議論し、コードを生成し、検証し、コミットする閉ループ。
#
# スケジュール:
#   - 毎週水曜 01:00 JST (UTC 16:00 火曜): 週次コード生成
#
# 手動実行も可能（workflow_dispatch）

name: System E Code Generation

on:
  schedule:
    - cron: '0 16 * * 2'    # 01:00 JST Wednesday (UTC 16:00 Tuesday)
  workflow_dispatch:
    inputs:
      mode:
        description: '実行モード'
        required: true
        type: choice
        options:
          - 'codegen'
          - 'evo-codegen'
      topic:
        description: '議論・生成トピック'
        required: false
        type: string
        default: 'システムの改善モジュールを設計・実装する'

permissions:
  contents: write

jobs:
  codegen:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install anthropic requests python-dotenv pyyaml ruff

      - name: Determine mode
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "mode=${{ inputs.mode }}" >> $GITHUB_OUTPUT
          else
            echo "mode=codegen" >> $GITHUB_OUTPUT
          fi

      - name: Run AI Code Generation
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          MODE="${{ steps.mode.outputs.mode }}"
          TOPIC="${{ inputs.topic }}"
          echo "=== AI Code Generation: $MODE ==="

          ARGS="--mode $MODE"
          if [ -n "$TOPIC" ] && [ "$MODE" = "codegen" ]; then
            ARGS="$ARGS --topic \"$TOPIC\""
          fi

          # コード生成（git commitはDeployerが行う）
          PYTHONPATH=. python -m system_e.orchestrator $ARGS

      - name: Run tests on generated code
        run: |
          echo "=== Testing generated code ==="
          PYTHONPATH=. python -m pytest tests/ -v --tb=short

      - name: Commit & push results
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # generated/ と system_e/data/ をコミット
          git add -f generated/ system_e/data/ || true
          git diff --cached --quiet || git commit -m "auto: AI code generation $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push
