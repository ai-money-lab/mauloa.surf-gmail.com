# GitHub Actions -- CITS kabuStation Auto-Login
# 毎回ログイン保証: commands.json へ bootstrap + login コマンドを注入
# VPS上の vps_agent が次回ポーリング時(~60秒以内)に実行する
#
# スケジュール (全てJST):
#   08:27  market open前 (メイン) — bootstrap + login 両方注入
#   09:05  market open後バックアップ
#   12:30  後場開始直前バックアップ
#
# watchdog.py も5分毎にAPI確認→自動ログインを実行するため多重保護。

name: CITS kabuStation Auto-Login

on:
  schedule:
    # 08:27 JST = 23:27 UTC (Mon=Sun UTC, Tue=Mon UTC, ..., Fri=Thu UTC)
    - cron: '27 23 * * 0-4'
    # 09:05 JST = 00:05 UTC (Mon-Fri)
    - cron: '5 0 * * 1-5'
    # 12:30 JST = 03:30 UTC (Mon-Fri) -- 後場開始前
    - cron: '30 3 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inject-login:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/continue-kabusute-DmFKB

      - name: Inject bootstrap + kabu_login commands
        run: |
          python3 - <<'EOF'
          import json
          from datetime import datetime, timezone, timedelta
          from pathlib import Path

          JST = timezone(timedelta(hours=9))
          now_jst = datetime.now(JST)
          ts = now_jst.strftime("%Y%m%d_%H%M")
          is_morning = now_jst.hour < 10  # 08:27 → bootstrap も注入

          f = Path("cits/data/commands.json")
          f.parent.mkdir(parents=True, exist_ok=True)
          try:
              cmds = json.loads(f.read_text(encoding="utf-8"))
          except Exception:
              cmds = []

          # 古い login/bootstrap コマンドをクリア
          cmds = [c for c in cmds
                  if not c.get("id", "").startswith("kabu_login_")
                  and not c.get("id", "").startswith("morning_bootstrap_")]

          # 08:27 JST のみ: タスク登録 + git pull を先に注入
          if is_morning:
              bootstrap_cmd = {
                  "id": f"morning_bootstrap_{ts}",
                  "type": "shell",
                  "command": (
                      "git -C C:\\cits\\repo fetch origin claude/continue-kabusute-DmFKB"
                      " && git -C C:\\cits\\repo reset --hard FETCH_HEAD"
                      " && schtasks /Create /TN CITS_Watchdog /RU SYSTEM"
                      " /TR \"C:\\cits\\repo\\cits\\run_watchdog.bat\""
                      " /SC MINUTE /MO 5 /RL HIGHEST /F"
                      " & schtasks /Create /TN CITS_VPSAgent /RU SYSTEM"
                      " /TR \"C:\\cits\\repo\\cits\\run_agent.bat\""
                      " /SC ONSTART /DELAY 0002:00 /RL HIGHEST /F"
                      " & schtasks /Create /TN CITS_LiveTrader /RU SYSTEM"
                      " /TR \"C:\\cits\\repo\\cits\\run_morning.bat\""
                      " /SC DAILY /ST 08:30 /D MON,TUE,WED,THU,FRI /RL HIGHEST /F"
                      " & schtasks /Create /TN CITS_PositionMonitor /RU SYSTEM"
                      " /TR \"C:\\cits\\repo\\cits\\run_monitor.bat\""
                      " /SC MINUTE /MO 30 /ST 09:30 /ET 15:25 /RL HIGHEST /F"
                      " & schtasks /Create /TN CITS_Afternoon /RU SYSTEM"
                      " /TR \"C:\\cits\\repo\\cits\\run_afternoon.bat\""
                      " /SC DAILY /ST 15:20 /D MON,TUE,WED,THU,FRI /RL HIGHEST /F"
                      " & schtasks /Create /TN CITS_Prefetch /RU SYSTEM"
                      " /TR \"C:\\cits\\repo\\cits\\run_prefetch.bat\""
                      " /SC DAILY /ST 14:00 /D MON,TUE,WED,THU,FRI /RL HIGHEST /F"
                      " & schtasks /Create /TN CITS_KabuStation_Start /RU Administrator"
                      " /TR \"C:\\Users\\Administrator\\AppData\\Local\\kabuStation\\KabuS.exe\""
                      " /SC DAILY /ST 08:25 /D MON,TUE,WED,THU,FRI /IT /F"
                      " & echo BOOTSTRAP_DONE"
                  ),
                  "timeout": 60
              }
              cmds.append(bootstrap_cmd)
              print(f"Injected bootstrap: {bootstrap_cmd['id']}")

          # ログインコマンド
          login_cmd = {
              "id": f"kabu_login_{ts}",
              "type": "module",
              "module": "cits.scripts.kabu_auto_login_vps",
              "timeout": 360
          }
          cmds.append(login_cmd)

          f.write_text(json.dumps(cmds, ensure_ascii=False, indent=2), encoding="utf-8")
          print(f"Injected login: {login_cmd['id']} at {now_jst.strftime('%H:%M JST')}")
          EOF

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f cits/data/commands.json
          git diff --cached --quiet || git commit -m "cits-kabu-login: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push origin claude/continue-kabusute-DmFKB
