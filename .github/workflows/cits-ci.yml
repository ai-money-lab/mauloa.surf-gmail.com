# GitHub Actions — CITS Trading System CI
# push/PR to main (cits/** paths) で自動テスト & Lint

name: CITS CI

on:
  push:
    branches: [main]
    paths:
      - 'cits/**'
  pull_request:
    branches: [main]
    paths:
      - 'cits/**'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r cits/requirements.txt

      - name: Lint check
        run: ruff check cits/

      - name: Run tests
        run: pytest cits/tests/ -v --tb=short
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
