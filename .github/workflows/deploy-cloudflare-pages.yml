name: Deploy jusetsu-quick to Cloudflare Pages

on:
  push:
    branches: [master]
    paths:
      - 'jusetsu-quick/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: jusetsu-quick/package-lock.json

      - name: Install dependencies
        working-directory: jusetsu-quick
        run: npm ci

      - name: Build for Cloudflare Pages
        working-directory: jusetsu-quick
        run: npm run pages:build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy .vercel/output/static --project-name=jusetsu-quick
          workingDirectory: jusetsu-quick
