name: Deploy jusetsu-quick to Cloudflare Pages

on:
  push:
    branches: [master, 'claude/cloudflare-setup-*']
    paths:
      - 'jusetsu-quick/**'
      - '.github/workflows/deploy-cloudflare-pages.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: jusetsu-quick/package-lock.json

      - name: Install dependencies
        working-directory: jusetsu-quick
        run: npm ci

      - name: Build Next.js (Vercel output)
        working-directory: jusetsu-quick
        run: npx vercel build
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'

      - name: Convert for Cloudflare Pages
        working-directory: jusetsu-quick
        run: npx @cloudflare/next-on-pages --skip-build

      - name: Run D1 migrations
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: d1 migrations apply jusetsu-quick-db --remote
          workingDirectory: jusetsu-quick

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy .vercel/output/static --project-name=jusetsu-quick
          workingDirectory: jusetsu-quick
