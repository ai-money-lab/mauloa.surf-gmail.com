llm:
  provider: anthropic
  deep_think: claude-opus-4-6
  quick_think: claude-sonnet-4-20250514
  analyst_temperature: 0.3
  debate_temperature: 0.4
  trader_temperature: 0.2
  use_api: false                    # false=ルール版（API不要）、true=AI版（API消費）

trading:
  mode: paper  # paper or live
  max_debate_rounds: 2
  watchlist:
    # ETF: kabuステーションで取引可能、¥10万以内、流動性高
    # 将来的にスキャナーで条件に合う銘柄を自動選定
    - "2644"   # GX半導体ETF          (勝率75%, +¥98,559)
    - "1540"   # 金ETF               (勝率73%, +¥50,887)
    - "1570"   # 日経レバレッジ2倍    (勝率83%, +¥32,963)
    - "1489"   # 日経高配当50 ETF    (勝率62%, +¥17,809)
    - "1321"   # 日経225 ETF         (勝率70%, +¥15,861)
    - "1357"   # 日経ダブルインバース  (勝率80%, +¥14,851)
    - "1343"   # REIT ETF            (勝率64%, +¥13,757)
    - "1306"   # TOPIX ETF           (勝率62%, +¥11,223)
    - "2558"   # S&P500連動ETF       (勝率40%, +¥1,043)

# CIS式 成功方程式
strategy:
  mode: cis
  entry:
    breakout_days: 20
    volume_confirm: true
    volume_ratio: 1.5
  exit:
    stop_pct: 1.5
    target_pct: 5.0
    hold_days: 5
  risk_per_trade: 0.05
  chart_datsu:
    enabled: false
  regime:
    method: ma_crossover
    volatile_atr_pct: 3.0

risk:
  daily_loss_limit_pct: 2.0
  max_consecutive_losses: 10
  max_daily_trades: 5
  volatility_threshold: 30.0
  risk_per_trade: 0.05
  stop_distance_pct: 1.5
  boj_meeting_reduce: true
  sq_week_reduce: true

broker:
  kabu_station:
    base_url: "http://localhost:18080"
    exchange: 1
  oco:
    poll_interval_sec: 5

execution:
  slippage_bps: 5.0
  spread_bps: 3.0
  commission: 0

  # Kei-kun戦略
  keikun:
    enabled: true
    sideways_days: 60
    sideways_range_pct: 15
    new_high_exit_days: 7
    stop_pct: 5.0
    max_hold_days: 30
    min_price: 100
    min_avg_volume: 5000

backtest:
  default_period: "1y"
  benchmark: "^N225"
  strategies:
    - cis_momentum
    - keikun

logging:
  level: INFO
  log_dir: cits/logs
