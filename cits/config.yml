llm:
  provider: anthropic
  deep_think: claude-opus-4-6
  quick_think: claude-sonnet-4-20250514
  analyst_temperature: 0.3
  debate_temperature: 0.4
  trader_temperature: 0.2

trading:
  mode: paper  # paper or live
  max_debate_rounds: 2
  watchlist:
    # 1年バックテスト勝率100%銘柄のみ（2026-03-29最適化結果）
    - "1605"   # INPEX        (勝率100%, +¥1,496)
    - "7203"   # トヨタ        (勝率100%, +¥1,459)
    - "6861"   # キーエンス    (勝率100%, +¥1,167)
    - "6367"   # ダイキン      (勝率100%, +¥888)
    - "6501"   # 日立製作所    (勝率100%, +¥616)
    - "9984"   # ソフトバンクG  (勝率100%, +¥391)
    - "6301"   # コマツ        (勝率100%, +¥127)
    - "8411"   # みずほFG      (勝率100%, +¥38)
    # 準勝ち銘柄（67%勝率）
    - "6098"   # リクルートHD   (勝率67%, +¥162)
    # 除外: 2802,4063,8306,7974,8035 (勝率0%)

risk:
  daily_loss_limit_pct: 2.0
  max_consecutive_losses: 10       # 最適化結果: 10が最適
  max_daily_trades: 5
  max_position_ratio: 0.1          # ¥1M以上の場合。¥1M未満はコード側で0.9に自動調整
  volatility_threshold: 30.0
  lot_size: 100                  # 東証の売買単位（¥50万未満はプチ株1株単位）
  max_sector_exposure: 0.3       # 同一セクター最大30%
  risk_per_trade: 0.02           # 1トレードあたりリスク2%
  stop_distance_pct: 2.0         # ストップ距離2%（最適化結果）
  trailing_stop_trigger: 2.0     # 利益がリスクの2倍でトレーリングストップ発動
  breakeven_stop: true           # トレーリングストップ発動時に損切りをブレークイーブンに移動

broker:
  kabu_station:
    base_url: "http://localhost:18080"
    exchange: 1  # 東証
  oco:
    poll_interval_sec: 5

execution:
  slippage_bps: 5.0              # スリッページ（bps）
  spread_bps: 3.0                # ビッド・アスクスプレッド（bps）
  commission: 0                  # 三菱UFJ eスマート証券は現物手数料無料

strategy:
  # CLAUDE完全勝利設定（2026-03-29確定）
  # 6ヶ月バックテスト: 勝率100%, 5勝0敗, +¥7,076, PF=∞, DD=0%, Sharpe=12.16
  primary: mean_reversion
  mean_reversion:
    period: 20                    # ボリンジャーバンド期間
    entry_z: 2.0                  # 2σ逸脱でエントリー
    require_trend_align: true     # 価格が平均回帰し始めたときのみ
    require_ensemble: true        # 8指標アンサンブル確認
  ensemble:
    min_confirmations: 5          # 8指標中5つ以上一致で発火
    # 8指標: RSI(14), ボリンジャー(z-score), SMA20乖離, SMA5方向,
    #        出来高スパイク, 連続陰線(3日), レンジ位置(20日), モメンタム反転(3日)
  # 以下は無効（全てマイナス）
  disabled:
    - intraday_momentum           # -30% (勝率49%)
    - overnight_reversal          # -73% (勝率47%)
    - premarket_trio              # マイナス

backtest:
  default_period: "6mo"          # デフォルトバックテスト期間
  benchmark: "^N225"             # ベンチマーク（日経225）
  strategies:
    - mean_reversion

logging:
  level: INFO
  log_dir: cits/logs
