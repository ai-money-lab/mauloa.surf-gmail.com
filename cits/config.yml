llm:
  provider: anthropic
  deep_think: claude-opus-4-6
  quick_think: claude-sonnet-4-20250514
  analyst_temperature: 0.3
  debate_temperature: 0.4
  trader_temperature: 0.2

trading:
  mode: paper
  max_debate_rounds: 2
  strategy_mode: hybrid  # hybrid = auto-switch (BNF style), cis = momentum, bnf = mean_reversion
  watchlist:
    # ETF: kabuステーションで取引可能、¥10万以内、流動性高
    # 銘柄は固定リストではなく条件で選定すべき（将来的にスキャナー実装）
    - "1357"   # 日経ダブルインバース
    - "2558"   # S&P500連動ETF
    - "1570"   # 日経レバレッジ2倍
    - "1540"   # 金ETF
    - "1489"   # 日経高配当50 ETF

pro_strategy:
  # プロトレーダー研究（テスタ・CIS・BNF）に基づく設計
  # 1. シンプルなルール（CIS: 出来高+価格のみ）
  # 2. レジーム適応（BNF: 上げ=順張り、下げ=逆張り）
  # 3. 高速損切り（テスタ: 取引の30-40%は損切り）

  regime_detection:
    method: ma_crossover    # MA20 vs MA50
    volatile_atr_pct: 3.0   # ATR > 3% = stay out

  ny_nikkei:
    enabled: true            # NYダウ→日経 相関0.898
    min_correlation: 0.5
    min_change_pct: 0.3      # 0.3%以上の動きでシグナル

  stop_loss:
    pct: 1.5                 # テスタ方式: 小さく損切り
    trailing: true           # 利益確保のトレーリングストップ

  target:
    pct: 3.0                 # 損失の2倍 = PF2.0以上

  hold_days: 5               # スイング: 3-10日保持
  risk_per_trade: 0.03       # 1トレード3%リスク

  # 月利目標: 2-3%（プロの現実的水準）
  # 複利10年: ¥100K → ¥1.9M (月利2.5%の場合)

risk:
  daily_loss_limit_pct: 2.0
  max_consecutive_losses: 10
  max_daily_trades: 5
  volatility_threshold: 30.0
  risk_per_trade: 0.03
  stop_distance_pct: 1.5
  # マクロリスク管理
  boj_meeting_reduce: true     # BOJ会合前日はポジション半減
  sq_week_reduce: true         # SQ週はポジション縮小
  monthly_target_pct: 2.5      # 現実的月利目標

broker:
  kabu_station:
    base_url: "http://localhost:18080"
    exchange: 1  # 東証
  oco:
    poll_interval_sec: 5

execution:
  slippage_bps: 5.0              # スリッページ（bps）
  spread_bps: 3.0                # ビッド・アスクスプレッド（bps）
  commission: 0                  # 三菱UFJ eスマート証券は現物手数料無料

strategy:
  # CLAUDE完全勝利設定（2026-03-29確定）
  # 6ヶ月バックテスト: 勝率100%, 5勝0敗, +¥7,076, PF=∞, DD=0%, Sharpe=12.16
  primary: mean_reversion
  mean_reversion:
    period: 20                    # ボリンジャーバンド期間
    entry_z: 2.0                  # 2σ逸脱でエントリー
    require_trend_align: true     # 価格が平均回帰し始めたときのみ
    require_ensemble: true        # 8指標アンサンブル確認
  ensemble:
    min_confirmations: 5          # 8指標中5つ以上一致で発火
    # 8指標: RSI(14), ボリンジャー(z-score), SMA20乖離, SMA5方向,
    #        出来高スパイク, 連続陰線(3日), レンジ位置(20日), モメンタム反転(3日)
  # 以下は無効（全てマイナス）
  disabled:
    - intraday_momentum           # -30% (勝率49%)
    - overnight_reversal          # -73% (勝率47%)
    - premarket_trio              # マイナス

backtest:
  default_period: "6mo"          # デフォルトバックテスト期間
  benchmark: "^N225"             # ベンチマーク（日経225）
  strategies:
    - mean_reversion

logging:
  level: INFO
  log_dir: cits/logs
