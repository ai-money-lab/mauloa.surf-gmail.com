general:
  timezone: "Asia/Tokyo"
  language: "ja"
  log_level: "INFO"
  project_root: "."
  monthly_api_budget_jpy: 50000

quality_checker:
  default_model: "claude-sonnet-4-20250514"
  max_retries: 3
  thresholds:
    x_post: 80
    report: 75
    data_collection: 70

system_a:
  posts_per_week: 8
  weekly_schedule:
    mon: { time: "07:30", pillar: 1, category: "プロの裏話" }
    tue: { time: "12:00", pillar: 3, category: "相談事例" }
    wed: { time: "07:30", pillar: 1, category: "プロの裏話" }
    thu: { time: "20:00", pillar: 2, category: "ビフォーアフター" }
    fri: { time: "07:30", pillar: [1, 5], category: "プロの裏話/時事ネタ" }
    sat: { time: "10:00", pillar: 4, category: "日常・人柄" }
    sun: { time: "20:00", pillar: 3, category: "相談事例/Q&A" }
    irregular: { pillar: 5, category: "時事ネタ速報" }
  min_interval_hours: 3
  pipeline_ratio:
    pipeline1_jp_buzz: 40
    pipeline2_data_driven: 35
    pipeline3_ai_original: 25
  pipeline_ratio_limits:
    min_per_pipeline: 15
    max_per_pipeline: 60
    weekly_adjustment_max: 10
  pipeline1:
    api_provider: "twitterapi.io"
    min_likes: 10000
    languages: ["ja"]
    lookback_hours: 72
    max_results: 30
  pipeline2:
    trend_sources: ["google_trends", "yahoo_news", "mlit_updates", "rakumachi"]
    system_c_integration: true
  pipeline3:
    theme_overlap_check_days: 30
    max_same_sub_theme_per_month: 2
  collection:
    api_provider: "twitterapi.io"
    min_likes: 50000
    lookback_hours: 72
    max_results: 20
  pillar_ratios:
    1: 0.30
    2: 0.25
    3: 0.20
    4: 0.15
    5: 0.10

system_b:
  auto_delivery: true
  notify_on_complete: true
  pdf_template_header: "ROCKEDGE Property Management"
  pdf_template_author: "HIROKI"

system_c:
  agents:
    max_concurrent: 4
    default_model: "claude-sonnet-4-20250514"
  scraping:
    rate_limit_per_second: 2
    user_agent: "HIROKI-AI-Research/1.0"

system_d:
  results_posts_per_week: 4
  target_pillars: [3, 5]

inquiry_bot:
  enabled: true
  server_port: 8080
  model: "claude-sonnet-4-20250514"
  channels: ["line", "web"]
  daily_report_time: "21:00"
  escalation_notify: ["line_notify", "slack"]
