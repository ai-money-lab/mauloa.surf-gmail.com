general:
  timezone: "Asia/Tokyo"
  language: "ja"
  log_level: "INFO"
  monthly_api_budget_jpy: 50000

quality_checker:
  default_model: "claude-sonnet-4-20250514"
  max_retries: 3
  thresholds:
    x_post: 84
    report: 75
    data_collection: 70

system_a:
  posts_per_day: 1
  post_times: ["19:00"]
  min_interval_hours: 3
  pipeline_ratio:
    pipeline1_jp_buzz: 40      # よくある困りごと回答型（売却・相続中心）
    pipeline2_data_driven: 35  # データ実用解説型
    pipeline3_ai_original: 25  # 現場エピソード型
  pipeline_ratio_limits:
    min_per_pipeline: 15
    max_per_pipeline: 60
    weekly_adjustment_max: 10
  pipeline1:
    api_provider: "twitterapi.io"
    min_likes: 10000
    languages: ["ja"]
    lookback_hours: 72
    max_results: 30
  pipeline2:
    trend_sources: ["google_trends", "yahoo_news", "mlit_updates", "rakumachi"]
    system_c_integration: true
  pipeline3:
    theme_overlap_check_days: 30
    max_same_sub_theme_per_month: 2

system_b:
  auto_delivery: true
  notify_on_complete: true
  pdf_template_header: "ROCKEDGE Property Management"
  pdf_template_author: "HIROKI"

system_c:
  agents:
    max_concurrent: 4
    default_model: "claude-sonnet-4-20250514"
  scraping:
    rate_limit_per_second: 2
    user_agent: "HIROKI-AI-Research/1.0"

system_d:
  results_posts_per_week: 4
  target_pillars: [1, 2]  # 1=売却・相続, 2=オーナー管理（自社サービスPR含む）

system_e:
  enabled: true
  posts_per_day: 4
  post_times_jst: ["07:00", "12:00", "19:00", "23:00"]
  image_provider: "comfyui_pod"  # comfyui_pod (GPU Pod直接) or runpod (Serverless) or fal_ai (Flux Pro)
  image_model: "flux-1-dev"  # flux-1-dev (RunPod) or flux-pro-v1.1-ultra (FAL.ai)
  kontext_enabled: true  # RunPod uses IP-Adapter equivalent
  fanvue_enabled: true
  content_language: "en"  # Primary content language
  x_account: ""  # System E dedicated X account handle
  reference_image_url: ""  # Reference image for character consistency
  daily_pipeline_mode: "full"  # full, generate, post
  runpod:
    # Set RUNPOD_API_KEY and RUNPOD_ENDPOINT_ID in .env
    # Endpoint: Deploy a Flux.1 Dev serverless worker on RunPod
    # Recommended GPU: RTX 4090 or A100 for fast inference
    max_poll_seconds: 180
  comfyui_pod:
    # Set RUNPOD_POD_ID in .env (GPU Podのxaix-comfyuiなど)
    # ComfyUI HTTP API (port 8188) に直接接続
    # Volume Disk: 75GB以上必要（Flux.1 Dev FP8: 16GB + システム: ~40GB）
    # 初回セットアップ: bash system_e/scripts/comfyui_pod_setup.sh
    max_poll_seconds: 300
  cost_tracking:
    monthly_budget_usd: 50  # RunPod is cheaper — budget reduced from $100
    alert_threshold_pct: 80

inquiry_bot:
  enabled: true
  server_port: 8080
  model: "claude-sonnet-4-20250514"
  channels: ["line", "web"]
  daily_report_time: "21:00"
  escalation_notify: ["line_messaging_api", "slack"]
