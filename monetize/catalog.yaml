# ─── サブスクリプション商品（月額課金） ───
subscription_products:

  - id: "sub_starter"
    name: "コンテンツ Starter"
    description: "月30枚の画像生成＋月10本のSNS投稿文。個人クリエイター向け。"
    price_jpy_monthly: 9800
    included:
      images_per_month: 30
      posts_per_month: 10
      models: ["flash"]
      max_size: "2K"
      api_access: false
    estimated_cost_jpy_monthly: 400
    overage_per_image_jpy: 200
    platforms: ["web"]

  - id: "sub_pro"
    name: "コンテンツ Pro"
    description: "月100枚＋月30本の投稿文＋Proモデル＋API access。"
    price_jpy_monthly: 29800
    included:
      images_per_month: 100
      posts_per_month: 30
      models: ["flash", "pro"]
      max_size: "4K"
      api_access: true
      reports_per_month: 2
    estimated_cost_jpy_monthly: 2000
    overage_per_image_jpy: 150
    platforms: ["web", "api"]

  - id: "sub_enterprise"
    name: "コンテンツ Enterprise"
    description: "無制限画像＋無制限投稿文＋専用API＋カスタムモデル対応。"
    price_jpy_monthly: 98000
    included:
      images_per_month: -1  # unlimited
      posts_per_month: -1
      models: ["flash", "pro"]
      max_size: "4K"
      api_access: true
      reports_per_month: 10
      priority_support: true
      custom_style: true
    estimated_cost_jpy_monthly: 10000
    overage_per_image_jpy: 0
    platforms: ["web", "api"]

# ─── API従量課金 ───
api_pricing:
  image_generation:
    flash_per_call_jpy: 50
    pro_per_call_jpy: 100
  text_generation:
    post_per_call_jpy: 30
    report_page_per_call_jpy: 100
  minimum_monthly_jpy: 5000
  free_tier:
    enabled: true
    images_per_month: 3
    posts_per_month: 5

# ─── 決済設定 ───
payment:
  provider: "stripe"
  currency: "jpy"
  webhook_path: "/api/payment/webhook"
  success_url: "/payment/success"
  cancel_url: "/payment/cancel"

# ─── 納品設定 ───
delivery:
  download_expiry_hours: 72
  max_download_count: 5
  storage_dir: "data/system_e/deliverables"
  archive_format: "zip"
