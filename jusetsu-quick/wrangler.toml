name = "jusetsu-quick"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = ".vercel/output/static"

# D1 Database binding (update database_id after running: wrangler d1 create jusetsu-quick-db)
[[d1_databases]]
binding = "DB"
database_name = "jusetsu-quick-db"
database_id = "c038eb89-5fe6-4931-a8ad-5ab926b77118"

[vars]
# REINFOLIB_API_KEY should be set via: npx wrangler secret put REINFOLIB_API_KEY
