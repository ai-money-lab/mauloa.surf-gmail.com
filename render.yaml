# Render.com Blueprint — HIROKI AI Empire 自動デプロイ
# https://render.com/docs/blueprint-spec
#
# 自動化方式: inquiry bot（無料Webサーバー）にトリガーAPIを内蔵
# Cloudflare Workers Cron Triggers からHTTPで呼び出してSystem A/Cを実行
# （旧: cron-job.org → 新: Cloudflare Workers に移行済み）
# → Render cronジョブ（有料$1/月×3）は不要

services:
  - type: web
    name: rockedge-inquiry-bot
    runtime: python
    plan: free
    region: oregon
    branch: claude/navigate-desktop-AYs6B
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn inquiry_bot.server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      # 共通
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: PYTHON_VERSION
        value: "3.12.0"
      - key: PYTHONPATH
        value: "."
      # 問い合わせBot
      - key: LINE_CHANNEL_SECRET
        sync: false
      - key: LINE_CHANNEL_ACCESS_TOKEN
        sync: false
      - key: LINE_USER_ID
        sync: false
      - key: SLACK_WEBHOOK_URL
        sync: false
      - key: INQUIRY_BOT_SHEET_ID
        sync: false
      # System A: X投稿
      - key: X_API_KEY
        sync: false
      - key: X_API_SECRET_KEY
        sync: false
      - key: X_ACCESS_TOKEN
        sync: false
      - key: X_ACCESS_TOKEN_SECRET
        sync: false
      - key: X_BEARER_TOKEN
        sync: false
      # System A: 画像生成
      - key: GEMINI_API_KEY
        sync: false
      # トリガーAPI認証
      - key: TRIGGER_SECRET
        sync: false
