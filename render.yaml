# Render.com Blueprint — 問い合わせBot自動デプロイ
# https://render.com/docs/blueprint-spec
# リポジトリのルートに配置 → Render が自動検出

services:
  - type: web
    name: rockedge-inquiry-bot
    runtime: python
    plan: free
    region: oregon
    branch: claude/build-ai-systems-IS1mw
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn inquiry_bot.server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: LINE_CHANNEL_SECRET
        sync: false
      - key: LINE_CHANNEL_ACCESS_TOKEN
        sync: false
      - key: LINE_NOTIFY_TOKEN
        sync: false
      - key: SLACK_WEBHOOK_URL
        sync: false
      - key: INQUIRY_BOT_SHEET_ID
        sync: false
      - key: PYTHON_VERSION
        value: "3.12.0"
      - key: PYTHONPATH
        value: "."
